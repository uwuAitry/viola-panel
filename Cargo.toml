# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "viola-panel"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Control panel for the orender output side of the viola-bridge chain"
publish = false

[dependencies]
# The window and its webview. `wry` is Tauri's own lower layer: it carries the
# WebView2 integration without Tauri's CLI, bundler or npm toolchain, neither of
# which this panel needs (design.md 9.1).
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
# The IPC envelope: `{ "cmd": ..., "args": ... }` (design.md 9.3).
serde_json = "1"
serde_yaml_ng = "0.10"

[profile.release]
opt-level = 2

